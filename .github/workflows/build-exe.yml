name: Build Windows EXE

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore unpackaged win-x64 dependencies
        run: |
          dotnet restore `
            .\ThreeFingerDragOnWindows\ThreeFingerDragOnWindows.csproj `
            --runtime win-x64 `
            -p:Platform=x64 `
            -p:UnpackagedBuild=true

      - name: Publish win-x64 application
        shell: pwsh
        run: |
          dotnet publish `
            .\ThreeFingerDragOnWindows\ThreeFingerDragOnWindows.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --no-restore `
            --output .\publish\win-x64 `
            -p:Platform=x64 `
            -p:UnpackagedBuild=true

      - name: Ensure elevator EXE exists
        shell: pwsh
        run: |
          $elevator = ".\publish\win-x64\ThreeFingerDragElevator.exe"

          if (!(Test-Path $elevator)) {
            dotnet publish `
              .\ThreeFingerDragElevator\ThreeFingerDragElevator.csproj `
              --configuration Release `
              --runtime win-x64 `
              --self-contained true `
              --output .\publish\win-x64
          }

          if (!(Test-Path ".\publish\win-x64\ThreeFingerDragOnWindows.exe")) {
            throw "Main EXE was not generated."
          }

          if (!(Test-Path $elevator)) {
            throw "Elevator EXE was not generated."
          }

          $requiredRuntimeFiles = @(
            ".\publish\win-x64\Microsoft.ui.xaml.dll",
            ".\publish\win-x64\Microsoft.WindowsAppRuntime.Bootstrap.dll"
          )

          foreach ($requiredFile in $requiredRuntimeFiles) {
            if (!(Test-Path $requiredFile)) {
              throw "Required Windows App SDK runtime file is missing: $requiredFile"
            }
          }

          $appPriFiles = @(
            ".\publish\win-x64\resources.pri",
            ".\publish\win-x64\ThreeFingerDragOnWindows.pri"
          ) | Where-Object { Test-Path $_ }

          if ($appPriFiles.Count -eq 0) {
            throw "The app PRI/XAML resources are missing. Restore and publish must both use UnpackagedBuild=true."
          }

      - name: Create ZIP
        shell: pwsh
        run: |
          Compress-Archive `
            -Path .\publish\win-x64\* `
            -DestinationPath .\ThreeFingerDragOnWindows-win-x64.zip `
            -Force

      - name: Upload compiled EXE package
        uses: actions/upload-artifact@v4
        with:
          name: ThreeFingerDragOnWindows-win-x64
          path: ThreeFingerDragOnWindows-win-x64.zip
          retention-days: 7
